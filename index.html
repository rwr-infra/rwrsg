<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RWRSG</title>
    <style>
      @font-face {
        font-family: "komikax";
        src: url("/komikax.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }

      #loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #7da109; /* 修改为指定的绿色背景 */
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        overflow: hidden; /* 防止滚动条出现 */
      }

      .logo-container {
        position: relative;
        width: 200px;
        height: 200px;
        flex-shrink: 0;
      }

      .logo-svg {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 180px;
        height: 180px;
        animation: logoBreath 1800ms cubic-bezier(0.23, 1, 0.32, 1) infinite;
      }

      /* A gentle breath: enough to signal "still working", never enough to
         distract while the bundle parses. */
      @keyframes logoBreath {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(0.96);
          opacity: 0.9;
        }
        50% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .logo-svg {
          animation: none;
        }
      }

      .loading-tip {
        position: absolute;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        color: #000;
        font-size: 18px;
        font-weight: bold;
        white-space: nowrap;
        font-family: Arial, sans-serif;
        z-index: 10000;
      }
    </style>
  </head>
  <body style="margin: 0">
    <div id="loading" role="status" aria-live="polite">
      <div class="logo-container">
        <!-- 使用SVG图标替换原有的徽标 -->
        <img src="/icon.svg" alt="Logo" class="logo-svg" />
      </div>
      <!-- 固定位置的提示文字 -->
      <div id="loading-tip" class="loading-tip">正在载入数据…</div>
    </div>

    <script>
      // 随机提示语列表 - 立即执行
      const tipsZh = [
        "在主页可添加物品、调整属性、生成售卖图片",
        "在表格页可搜索筛选、查看武器详细规格",
        "支持导入导出 JSON 数据文件，方便数据迁移",
        "数据自动保存到本地浏览器，刷新不会丢失",
        "右上角开关可切换深色/浅色主题",
        "价格单位 RP（资源点）",
        "点击侧边栏在主页和表格页之间切换",
        "导出的售卖图片可直接复制到剪贴板",
        "支持价格打折设置，便于促销",
        "库存数量可灵活调整，适合批量管理",
        "售卖图片可自定义背景色和字体样式",
        "数据包含武器、装备、物品等所有物品信息",
        "按 F5 刷新页面查看新的随机提示"
      ];
      const tipsEn = [
        "Add items, adjust properties and render your stall on the home page",
        "The workbench lets you search, filter and inspect full item specs",
        "Import and export JSON files to move your data between devices",
        "Your data is saved in this browser — refreshing will not lose it",
        "The switch in the header toggles dark mode",
        "Prices are in RP (resource points)",
        "Use the sidebar to move between the home page and the workbench",
        "An exported stall image can be copied straight to the clipboard",
        "Set a discount to run a sale",
        "Quantities are adjustable, so bulk listings are quick to build",
        "The stall image accepts a custom background colour and font",
        "The catalog covers weapons, gear and every other item",
        "Press F5 for another random tip"
      ];
      // 与 i18n.jsx 使用同一个 lang 键，语言切换后提示语也随之切换
      const isZh = (localStorage.getItem("lang") || "zh") === "zh";
      const tips = isZh ? tipsZh : tipsEn;
      const randomTip = tips[Math.floor(Math.random() * tips.length)];
      const tipElement = document.getElementById("loading-tip");
      if (tipElement) {
        tipElement.textContent = randomTip;
        tipElement.lang = isZh ? "zh-CN" : "en";
      }
    </script>

    <div id="root"></div>

    <script type="module">
      // 当React应用挂载完成后移除加载提示
      document.addEventListener("DOMContentLoaded", () => {
        const root = document.getElementById("root");

        // 创建MutationObserver监听root节点变化
        const observer = new MutationObserver((mutations) => {
          mutations.forEach((mutation) => {
            if (mutation.addedNodes.length > 0) {
              // 当React组件挂载后隐藏加载提示
              document.getElementById("loading").style.display = "none";
              observer.disconnect();
            }
          });
        });

        // 开始观察root节点
        observer.observe(root, { childList: true, subtree: true });
      });
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
