name: Deploy to GitHub Pages

on:
  push:
    branches: [main] # 触发分支（根据你的主分支名称修改）
  workflow_dispatch: # 允许手动触发

# The deploy pushes the built site to the `gh-pages` branch, so the job needs to
# write to the repo. Without this the default token is read-only for a repo
# owned by an organisation (it was read/write while this lived under a personal
# account), and the push fails with:
#   remote: Permission to rwr-infra/rwrsg.git denied to github-actions[bot].
#   403
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` so the lockfile is authoritative, not advisory.
      - name: Install Dependencies
        run: npm ci

      # The same gate that runs locally: lint + tests + build. A red check stops
      # the deploy, which is the point of having one.
      - name: Check
        run: npm run check

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
